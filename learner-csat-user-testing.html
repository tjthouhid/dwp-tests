<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learner CSAT checks</title>
<style>
  :root {
    --paper: #f3f5f8;
    --card: #ffffff;
    --ink: #1b2430;
    --muted: #5c6b7c;
    --line: #e2e7ef;
    --orange: #e4570e;
    --orange-soft: #fff1e8;
    --ok: #157347;
    --ok-soft: #e8f6ee;
    --bad: #b42318;
    --bad-soft: #fdeceb;
    --skip: #8a5a00;
    --skip-soft: #fff6de;
    --shadow: 0 18px 40px rgba(27, 36, 48, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 17px/1.5 "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside {
    background: #fff;
    border-right: 1px solid var(--line);
    padding: 28px 18px 24px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: auto;
  }
  .brand { padding: 0 10px 18px; }
  .brand h1 { margin: 0; font-size: 22px; letter-spacing: -0.03em; line-height: 1.2; }
  .brand p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .progress-line { height: 8px; background: var(--line); border-radius: 99px; margin: 16px 10px 6px; overflow: hidden; }
  .progress-line span { display: block; height: 100%; background: var(--orange); width: 0; }
  .progress-caption { margin: 0 10px 18px; color: var(--muted); font-size: 13px; }
  .jump { width: calc(100% - 20px); margin: 0 10px 16px; }
  .ask { margin: 0 0 10px; font-weight: 700; }
  nav { display: flex; flex-direction: column; gap: 18px; }
  .nav-group h2 { margin: 0 8px 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .nav-item {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .nav-item:hover { background: var(--paper); }
  .nav-item.current { background: var(--orange-soft); }
  .dot {
    width: 22px; height: 22px; border-radius: 50%; flex: none; margin-top: 1px;
    border: 2px solid #c5ced8; background: #fff;
  }
  .dot.pass { background: var(--ok); border-color: var(--ok); }
  .dot.fail { background: var(--bad); border-color: var(--bad); }
  .dot.blocked { background: var(--skip); border-color: var(--skip); }
  .nav-item span.title { font-size: 14.5px; line-height: 1.35; }
  main { padding: 36px 40px 64px; max-width: 860px; }
  .card {
    background: var(--card);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 32px 34px;
  }
  .kicker { margin: 0 0 8px; color: var(--orange); font-weight: 600; font-size: 14px; }
  h2.screen-title { margin: 0 0 10px; font-size: 32px; letter-spacing: -0.035em; line-height: 1.15; }
  .lede { margin: 0 0 22px; color: #334155; font-size: 18px; max-width: 38em; }
  .need { display: grid; gap: 12px; margin: 0 0 26px; }
  .need article {
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 12px;
    align-items: start;
    background: var(--paper);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .need strong { display: block; }
  .need p { margin: 2px 0 0; color: var(--muted); }
  .mark {
    width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center;
    background: #fff; font-weight: 700; color: var(--orange);
  }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
  label.field span.hint { font-weight: 400; color: var(--muted); }
  input[type="text"], input[type="date"], select, textarea {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    font-weight: 400;
  }
  textarea { width: 100%; min-height: 88px; resize: vertical; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .primary, .ghost, .choice {
    border-radius: 12px;
    padding: 12px 16px;
    border: 1px solid transparent;
  }
  .primary { background: var(--orange); color: #fff; border-color: var(--orange); font-weight: 650; }
  .primary:hover { background: #c94b0b; }
  .ghost { background: #fff; border-color: var(--line); }
  .ghost:hover { background: var(--paper); }
  .steps { margin: 0 0 18px; padding: 0; list-style: none; display: grid; gap: 10px; }
  .steps li {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 12px;
    align-items: start;
  }
  .steps li i {
    font-style: normal;
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 700;
  }
  .see {
    background: var(--ok-soft);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .see strong { display: block; margin-bottom: 4px; color: var(--ok); }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .choice {
    background: #fff;
    border: 2px solid var(--line);
    text-align: left;
    min-height: 72px;
  }
  .choice small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
  .choice.pass.active { background: var(--ok-soft); border-color: var(--ok); }
  .choice.fail.active { background: var(--bad-soft); border-color: var(--bad); }
  .choice.blocked.active { background: var(--skip-soft); border-color: var(--skip); }
  .note-label { display: block; font-weight: 600; margin-bottom: 6px; }
  .footer-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 8px 0 22px; }
  .summary article { border-radius: 16px; padding: 16px; }
  .summary .n { font-size: 36px; letter-spacing: -0.04em; line-height: 1; }
  .summary .ok { background: var(--ok-soft); }
  .summary .bad { background: var(--bad-soft); }
  .summary .skip { background: var(--skip-soft); }
  .problem-list { margin: 0 0 20px; padding-left: 18px; }
  .problem-list li { margin: 6px 0; }
  .saved-note { color: var(--muted); font-size: 14px; margin: 14px 0 0; }
  .result-box {
    width: 100%;
    min-height: 220px;
    margin: 8px 0 16px;
    font: 13px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    background: #f8fafc;
    white-space: pre;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .print-sheet { display: none; }
  @media (min-width: 901px) {
    .jump { display: none; }
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside { position: relative; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    nav { display: none; }
    main { padding: 20px 16px 40px; }
    .card { padding: 22px 18px; border-radius: 18px; }
    h2.screen-title { font-size: 26px; }
    .fields, .choices, .summary { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media print {
    .app { display: none; }
    .print-sheet { display: block; padding: 24px; }
    .print-sheet h1 { margin: 0 0 8px; }
    .print-sheet article { break-inside: avoid; border-top: 1px solid #ccc; padding: 12px 0; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>Learner CSAT checks</h1>
      <p>Work through the list. Your answers stay in this browser.</p>
    </div>
    <div class="progress-line" aria-hidden="true"><span id="bar"></span></div>
    <p class="progress-caption" id="caption">Not started</p>
    <select class="jump" id="jump" aria-label="Jump to a check"></select>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="card" id="stage"></div>
  </main>
</div>
<div class="print-sheet" id="print-sheet"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const GROUPS = [
  {
    title: 'Before you start',
    cases: [
      {
        id: 'S1',
        title: 'Set up a learner who has finished something',
        steps: [
          'Ask a developer, or use the admin site, to give a test learner one finished course (status Completed or Passed, finished in the last 30 days).',
          'Book the same learner on an event that has already ended. Ideally use a multi-day event with 2 or more days, plus a single-day event.',
          'Write down the learner’s email, the course name and the event names.'
        ],
        see: 'You have a learner with at least one finished course and one finished event. This is set-up only; mark It worked once it is ready. The Course, One-day event and Multi-day event situations further on each need their own learner, set up as the check describes.'
      }
    ]
  },
  {
    title: 'The learner is asked for feedback',
    cases: [
      {
        id: 'L1',
        title: 'The feedback box pops up after sign-in',
        steps: [
          'Sign in to the learner site as your test learner.',
          'Wait about 3 seconds on My Courses.'
        ],
        see: 'A box opens asking “How would you rate this course?” (or event or session), with the name of what you finished, five stars, a comment box, and the buttons Skip, Later and Submit feedback. If several things are waiting, the top says something like “1 of 3”.'
      },
      {
        id: 'L2',
        title: 'You must pick stars before you can submit',
        steps: [
          'In the box, do not touch the stars.',
          'Look at the Submit feedback button.',
          'Now hover over the stars, then click the 4th star.'
        ],
        see: 'Submit feedback is greyed out until you choose stars. Hovering lights the stars up, and the label under them changes (Very poor, Poor, Okay, Good, Excellent). After clicking the 4th star it says Good.'
      },
      {
        id: 'L3',
        title: 'Keyboard only',
        steps: [
          'Press Tab until a star is highlighted.',
          'Use the left and right arrow keys.',
          'Press Tab to reach Submit feedback and press Enter.'
        ],
        see: 'The arrow keys move the rating up and down, the label changes, and you can submit without a mouse.'
      },
      {
        id: 'L4',
        title: 'Submit a rating with a comment',
        steps: [
          'Choose 5 stars and type a short comment, for example “Clear and practical”.',
          'A tick box appears asking if the comment can be used as a testimonial. Tick it.',
          'Press Submit feedback.'
        ],
        see: 'A “Thanks for your feedback!” message appears. The box moves on to the next item, or closes if there is nothing left.'
      },
      {
        id: 'L5',
        title: 'The testimonial tick box needs a comment',
        steps: [
          'On the next item, choose a rating but leave the comment empty.'
        ],
        see: 'The testimonial tick box does not appear while the comment is empty.'
      },
      {
        id: 'L6',
        title: 'Skip means “don’t ask me again”',
        steps: [
          'On an item, press Skip.',
          'Sign out, sign back in, and wait on My Courses.'
        ],
        see: 'The skipped item is not asked about again in the pop-up.'
      },
      {
        id: 'L7',
        title: 'Later means “not now”',
        steps: [
          'Make sure the learner has at least one more item waiting (ask for another finished event if needed).',
          'When the box opens, press Later, or press Esc, or click outside the box.',
          'Move to another page in the learner site.',
          'Close every tab of the site, open it again in a new tab and sign in.'
        ],
        see: 'After Later the box stays hidden while you move around. In a fresh tab or browser it asks again.'
      },
      {
        id: 'L8',
        title: 'Rated items are not asked again',
        steps: [
          'Sign out and sign back in after rating something in L4.'
        ],
        see: 'The item you already rated does not appear in the pop-up.'
      },
      {
        id: 'L9',
        title: 'No pop-up on the DWP testimonial page',
        steps: [
          'As a DWP learner who has passed, open the DWP testimonial page (/courses/dwp/testimonial).',
          'Wait 5 seconds.'
        ],
        see: 'No feedback pop-up appears on top of the DWP testimonial form. The testimonial form itself has not changed. The pop-up can appear on other pages, such as My Courses.'
      },
      {
        id: 'L10',
        title: 'Old training is not pushed',
        steps: [
          'Use a learner whose only finished course ended more than 30 days ago.',
          'Sign in and wait on My Courses.'
        ],
        see: 'No pop-up appears for training finished more than 30 days ago.'
      },
      {
        id: 'L11',
        title: 'Nothing finished, nothing asked',
        steps: [
          'Sign in as a learner with no finished courses and no finished events.'
        ],
        see: 'No pop-up appears. No error message appears.'
      }
    ]
  },
  {
    title: 'Events and sessions',
    cases: [
      {
        id: 'E1',
        title: 'Each day of a multi-day event can be rated',
        steps: [
          'Use a learner booked on an event with 2 or more days (sessions), where some days are already over.',
          'Sign in and look at the pop-up items.'
        ],
        see: 'You get a separate “How would you rate this session?” for each day that has ended, named like “Day 1 · Event name”. Days still to come are not asked about.'
      },
      {
        id: 'E2',
        title: 'The whole event is rated once it finishes',
        steps: [
          'Use the same learner after the last day of that event has ended.'
        ],
        see: 'As well as the days, you get one “How would you rate this event?” for the whole event.'
      },
      {
        id: 'E3',
        title: 'A one-day event asks only once',
        steps: [
          'Use a learner booked on a finished event that has only one session.'
        ],
        see: 'Only one question, for the event. There is no separate question for its single session.'
      },
      {
        id: 'E4',
        title: 'Absent learners are not asked',
        steps: [
          'In the admin site, mark a booked learner Absent on a finished event.',
          'Sign in as that learner.'
        ],
        see: 'That learner is not asked to rate that event or the days they missed.'
      },
      {
        id: 'E5',
        title: 'Rate from the event page',
        steps: [
          'As a learner, go to My events and open a finished event you have not rated yet (press Later on the pop-up if it opens).',
          'Find the Your feedback card on the right.',
          'Press Rate next to the event or a session, choose stars and submit.'
        ],
        see: 'The card lists what you can still rate, each with a Rate button. After you submit, that line moves into the list underneath with its stars. There is no Skip button here.'
      },
      {
        id: 'E6',
        title: 'Older events can still be rated from the event page',
        steps: [
          'Open an event that finished more than 30 days ago that you have not rated.'
        ],
        see: 'The Your feedback card still lets you rate it, even though the pop-up does not ask about it.'
      }
    ]
  },
  {
    title: 'Course situations',
    cases: [
      {
        id: 'CS1',
        title: 'Course with status Completed',
        steps: [
          'Use a learner whose course was set to Completed yesterday.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'The box says “Course feedback” at the top, asks “How would you rate this course?”, and shows the course name.'
      },
      {
        id: 'CS2',
        title: 'Course with status Passed',
        steps: [
          'Use a learner whose course was set to Passed yesterday.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'The box says “Course feedback” at the top, asks “How would you rate this course?”, and shows the course name.'
      },
      {
        id: 'CS3',
        title: 'Course still in progress',
        steps: [
          'Use a learner whose course is In progress. If you can, pick one that is close to its expiry date.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'No pop-up for this course. It is only asked about once it is Completed or Passed.'
      },
      {
        id: 'CS4',
        title: 'Course not started',
        steps: [
          'Use a learner whose course is Not started.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'No pop-up for this course.'
      },
      {
        id: 'CS5',
        title: 'Course failed',
        steps: [
          'Use a learner whose course is Failed.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'No pop-up for this course.'
      },
      {
        id: 'CS6',
        title: 'Course with status Expired',
        steps: [
          'Use a learner whose course status is Expired.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'No pop-up for this course.'
      },
      {
        id: 'CS7',
        title: 'Course finished 25 days ago',
        steps: [
          'Use a learner whose course was Completed 25 days ago.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'The pop-up still asks about it, because it is inside the last 30 days. The box says “Course feedback” at the top, asks “How would you rate this course?”, and shows the course name.'
      },
      {
        id: 'CS8',
        title: 'Finished course whose licence has expired',
        steps: [
          'Use a learner whose course is Completed, but whose licence has since ended.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'The pop-up still asks about it. Only the course status counts, not the licence. The box says “Course feedback” at the top, asks “How would you rate this course?”, and shows the course name.'
      },
      {
        id: 'CS9',
        title: 'Two finished courses',
        steps: [
          'Use a learner with two courses Completed on different days in the last 30 days.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.',
          'Rate the first one and submit.'
        ],
        see: 'Two questions, one after the other. The top shows “1 of 2”, then “2 of 2”. The most recently finished course comes first.'
      }
    ]
  },
  {
    title: 'One-day event situations',
    cases: [
      {
        id: 'ES1',
        title: 'Event ended, learner booked, no register taken',
        steps: [
          'Use a learner with a confirmed booking on a one-day event that ended yesterday. Do not mark attendance.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'The box says “Event feedback” at the top, asks “How would you rate this event?”, and shows the event name. There is no separate question for its single session.'
      },
      {
        id: 'ES2',
        title: 'Event ending soon',
        steps: [
          'Use a learner booked on an event that ends later today, or in a few days.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.',
          'Sign in again after the event’s end time has passed.'
        ],
        see: 'Nothing while the event is still running. After the end time has passed, the pop-up asks about it.'
      },
      {
        id: 'ES3',
        title: 'Event not started yet',
        steps: [
          'Use a learner booked on an event that starts in the future.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'No pop-up for this event.'
      },
      {
        id: 'ES4',
        title: 'Learner marked Present',
        steps: [
          'Use a learner booked on a finished one-day event and marked Present on the register.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'The box says “Event feedback” at the top, asks “How would you rate this event?”, and shows the event name. There is no separate question for its single session.'
      },
      {
        id: 'ES5',
        title: 'Learner marked Late',
        steps: [
          'Use a learner booked on a finished one-day event and marked Late on the register.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'The box says “Event feedback” at the top, asks “How would you rate this event?”, and shows the event name. There is no separate question for its single session.'
      },
      {
        id: 'ES6',
        title: 'Learner marked Excused',
        steps: [
          'Use a learner booked on a finished event and marked Excused on the register.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'No pop-up appears for this. Open the event page as well: there is no Your feedback card for it.'
      },
      {
        id: 'ES7',
        title: 'Marked Present without a booking',
        steps: [
          'Use a learner who has no booking on a finished event but was marked Present on its register.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'The pop-up still asks about it. The box says “Event feedback” at the top, asks “How would you rate this event?”, and shows the event name. There is no separate question for its single session.'
      },
      {
        id: 'ES8',
        title: 'Booking cancelled',
        steps: [
          'Use a learner whose booking on a finished event was cancelled.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'No pop-up appears for this. Open the event page as well: there is no Your feedback card for it.'
      },
      {
        id: 'ES9',
        title: 'Event that is Draft, Provisional or Cancelled',
        steps: [
          'Use a learner booked on an event with past dates whose status is Draft, Provisional or Cancelled.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'No pop-up appears for this. Open the event page as well: there is no Your feedback card for it.'
      },
      {
        id: 'ES10',
        title: 'Event marked Completed before its end time',
        steps: [
          'Use a learner booked on an event that has started, whose end time is still in the future, but whose status has been set to Completed.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'The pop-up asks about it. Marking an event Completed counts as finished once it has started. The box says “Event feedback” at the top, asks “How would you rate this event?”, and shows the event name. There is no separate question for its single session.'
      },
      {
        id: 'ES11',
        title: 'Event ending at midnight',
        steps: [
          'Use a learner booked on an event whose end time is 00:00 on today’s date.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.',
          'Sign in again tomorrow.'
        ],
        see: 'Not asked today: an end time of 00:00 counts as the end of that day, UK time. It is asked about from tomorrow.'
      }
    ]
  },
  {
    title: 'Multi-day event situations',
    cases: [
      {
        id: 'MS1',
        title: 'Multi-day event still running',
        steps: [
          'Use a learner booked on a two-day event where Day 1 has finished and Day 2 is tomorrow.',
          'Sign in to the learner site as that learner and wait about 3 seconds on My Courses.'
        ],
        see: 'One question only: “How would you rate this session?” with “Day 1 · event name”. No question about Day 2 or the whole event yet.'
      },
      {
        id: 'MS2',
        title: 'Booked on one day only',
        steps: [
          'Use a learner booked only on Day 2 of a two-day event (a session booking), with both days finished.',

const STORAGE_KEY = 'ut-cea-192-learner-csat-v1';
const STATUS_LABEL = { pass: 'It worked', fail: 'Something’s wrong', blocked: 'I couldn’t try this', '': 'Not checked' };

const state = loadState();

function loadState() {
  const empty = { meta: {}, cases: {}, screen: 'welcome', index: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    return saved ? { ...empty, ...saved, meta: saved.meta || {}, cases: saved.cases || {} } : empty;
  } catch {
    return empty;
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderChrome();
}

function allCases() {
  return GROUPS.flatMap((group) => group.cases);
}

function caseAt(index) {
  return allCases()[index];
}

function caseState(id) {
  state.cases[id] = state.cases[id] || { status: '', notes: '' };
  return state.cases[id];
}

function totals() {
  const counts = { pass: 0, fail: 0, blocked: 0, done: 0, total: allCases().length };
  allCases().forEach((item) => {
    const status = caseState(item.id).status;
    if (status) {
      counts[status] += 1;
      counts.done += 1;
    }
  });
  return counts;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
}

function groupFor(index) {
  let cursor = 0;
  for (const group of GROUPS) {
    if (index < cursor + group.cases.length) return { group, place: index - cursor + 1 };
    cursor += group.cases.length;
  }
  return { group: GROUPS[0], place: 1 };
}

function renderChrome() {
  const counts = totals();
  document.getElementById('bar').style.width = `${(counts.done / counts.total) * 100}%`;
  document.getElementById('caption').textContent = counts.done === 0
    ? `${counts.total} checks`
    : `${counts.done} of ${counts.total} checked`;

  document.getElementById('nav').innerHTML = GROUPS.map((group) => `
    <div class="nav-group">
      <h2>${escapeHtml(group.title)}</h2>
      ${group.cases.map((item) => {
        const index = allCases().findIndex((candidate) => candidate.id === item.id);
        const status = caseState(item.id).status;
        const current = state.screen === 'check' && state.index === index ? 'current' : '';
        return `<button type="button" class="nav-item ${current}" data-goto="${index}">
          <i class="dot ${status}"></i>
          <span class="title">${escapeHtml(item.title)}</span>
        </button>`;
      }).join('')}
    </div>
  `).join('');

  const jump = document.getElementById('jump');
  const currentValue = state.screen === 'welcome' ? 'welcome' : state.screen === 'done' ? 'done' : String(state.index);
  jump.innerHTML = `<option value="welcome">Start here</option>` + allCases().map((item, index) => {
    const status = caseState(item.id).status;
    const mark = status === 'pass' ? '✓ ' : status === 'fail' ? '! ' : status === 'blocked' ? '– ' : '';
    return `<option value="${index}">${mark}${escapeHtml(item.title)}</option>`;
  }).join('') + `<option value="done">After the test</option>`;
  jump.value = currentValue;

  renderPrint();
}

function renderPrint() {
  const meta = state.meta;
  document.getElementById('print-sheet').innerHTML = `
    <h1>Learner CSAT check</h1>
    <p>${escapeHtml(meta.tester || 'Name not given')} · ${escapeHtml(meta.environment || 'Place not given')} · ${escapeHtml(meta.date || '')}</p>
    <p>${escapeHtml(meta.accounts || '')}</p>
    ${allCases().map((item) => {
      const current = caseState(item.id);
      return `<article><strong>${escapeHtml(item.title)}</strong> — ${escapeHtml(STATUS_LABEL[current.status])}${current.notes ? `<br>${escapeHtml(current.notes)}` : ''}</article>`;
    }).join('')}
  `;
}

function field(name, label, hint, control) {
  return `<label class="field">${label}${hint ? `<span class="hint">${hint}</span>` : ''}${control.replace('VALUE', escapeHtml(state.meta[name] || ''))}</label>`;
}

function renderWelcome() {
  if (!state.meta.date) state.meta.date = new Date().toISOString().slice(0, 10);
  const counts = totals();
  document.getElementById('stage').innerHTML = `
    <p class="kicker">For the person checking this</p>
    <h2 class="screen-title">Can learners rate their training, and can we see it?</h2>
    <p class="lede">Sign in, try each check, and mark what happened. You do not need to know how the system is built.</p>
    <div class="need">
      <article><div class="mark">1</div><div><strong>Learner sign-ins</strong><p>A learner with a course and an event finished in the last 30 days. If you can, also a DWP learner who has passed, and a learner with nothing finished. The situation checks need one learner each, set up as each check describes.</p></div></article>
      <article><div class="mark">2</div><div><strong>Admin sign-ins</strong><p>An IW Owner login, and one other admin login (for example Business Development) to check who is kept out and that access can be granted.</p></div></article>
      <article><div class="mark">3</div><div><strong>A finished multi-day event</strong><p>An event with 2 or more days that has ended, with your learner booked on it. Ask a developer if you need one set up.</p></div></article>
    </div>
    <div class="fields">
      ${field('tester', 'Your name', '', '<input type="text" data-meta="tester" value="VALUE" autocomplete="name">')}
      ${field('environment', 'Where are you testing?', '', `<select data-meta="environment">
        <option value="">Choose one</option>
        <option ${state.meta.environment === 'The shared test site' ? 'selected' : ''}>The shared test site</option>
        <option ${state.meta.environment === 'My own computer' ? 'selected' : ''}>My own computer</option>
        <option ${state.meta.environment === 'I’m not sure' ? 'selected' : ''}>I’m not sure</option>
      </select>`)}
      ${field('date', 'Today’s date', '', '<input type="date" data-meta="date" value="VALUE">')}
      ${field('accounts', 'Whose sign-ins did you use?', '', '<input type="text" data-meta="accounts" value="VALUE" placeholder="For example: test learner jo@…, my owner login, Sam from Finance">')}
    </div>
    <div class="actions">
      <button type="button" class="primary" data-go="check">${counts.done ? 'Continue the checks' : 'Start the first check'}</button>
      ${counts.done ? '<button type="button" class="ghost" data-go="done">After the test</button>' : ''}
    </div>
    <p class="saved-note">Your answers stay in this browser. The last page shows how to copy them into Jira, an email, or a message.</p>
  `;
}

function renderCheck() {
  const item = caseAt(state.index);
  const { group, place } = groupFor(state.index);
  const current = caseState(item.id);
  const last = state.index === allCases().length - 1;
  document.getElementById('stage').innerHTML = `
    <p class="kicker">${escapeHtml(group.title)} · ${place} of ${group.cases.length}</p>
    <h2 class="screen-title">${escapeHtml(item.title)}</h2>
    <ol class="steps">
      ${item.steps.map((step, index) => `<li><i>${index + 1}</i><span>${escapeHtml(step)}</span></li>`).join('')}
    </ol>
    <div class="see"><strong>What you should see</strong>${escapeHtml(item.see)}</div>
    <p class="ask">How did it go?</p>
    <div class="choices" role="group" aria-label="How did it go?">
      ${[
        ['pass', 'It worked', 'This matched what I should see'],
        ['fail', 'Something’s wrong', 'This did not match'],
        ['blocked', 'I couldn’t try this', 'I didn’t have what I needed']
      ].map(([status, label, hint]) => `
        <button type="button" class="choice ${status} ${current.status === status ? 'active' : ''}" data-status="${status}" aria-pressed="${current.status === status}">
          ${label}<small>${hint}</small>
        </button>
      `).join('')}
    </div>
    <label class="note-label" for="notes">What did you see? <span class="hint" style="font-weight:400;color:var(--muted)">Optional</span></label>
    <textarea id="notes" placeholder="Add anything that would help us understand. Leave this empty if it simply worked.">${escapeHtml(current.notes)}</textarea>
    <div class="footer-nav">
      <button type="button" class="ghost" data-go="${state.index === 0 ? 'welcome' : 'prev'}">${state.index === 0 ? 'Back to the start' : 'Previous check'}</button>
      <button type="button" class="primary" data-go="${last ? 'done' : 'next'}">${last ? 'Finish and send results' : 'Next check'}</button>
    </div>
  `;
}

function renderDone() {
  const counts = totals();
  const problems = allCases().filter((item) => caseState(item.id).status === 'fail');
  const skipped = allCases().filter((item) => caseState(item.id).status === 'blocked');
  const unchecked = counts.total - counts.done;
  const report = resultsText();
  document.getElementById('stage').innerHTML = `
    <p class="kicker">After the test</p>
    <h2 class="screen-title">Send your results</h2>
    <p class="lede">Someone else needs to see what you found. Copy the report below and paste it into Jira, an email, or a message. You do not need to retype the checks.</p>
    <div class="need">
      <article><div class="mark">1</div><div><strong>Copy the report</strong><p>Press Copy results. The full report is placed on your clipboard.</p></div></article>
      <article><div class="mark">2</div><div><strong>Open where it should go</strong><p>Open the Jira ticket, or an email, Slack, or Teams message to the person who asked you to test.</p></div></article>
      <article><div class="mark">3</div><div><strong>Paste</strong><p>Paste into a comment or the message. They will see your name, what worked, what needs a look, and any notes you wrote.</p></div></article>
    </div>
    <div class="summary">
      <article class="ok"><div class="n">${counts.pass}</div>worked</article>
      <article class="bad"><div class="n">${counts.fail}</div>need a look</article>
      <article class="skip"><div class="n">${counts.blocked}</div>couldn’t try</article>
    </div>
    ${unchecked ? `<p class="saved-note">${unchecked} ${unchecked === 1 ? 'check has' : 'checks have'} no answer yet. You can still send this, or go back and finish them.</p>` : ''}
    ${problems.length ? `<p><strong>Needs a look</strong></p><ul class="problem-list">${problems.map((item) => `<li>${escapeHtml(item.title)}${caseState(item.id).notes ? ` — ${escapeHtml(caseState(item.id).notes)}` : ''}</li>`).join('')}</ul>` : ''}
    ${skipped.length ? `<p><strong>Couldn’t try</strong></p><ul class="problem-list">${skipped.map((item) => `<li>${escapeHtml(item.title)}</li>`).join('')}</ul>` : ''}
    <label class="note-label" for="result-text">This is what will be pasted</label>
    <textarea id="result-text" class="result-box" readonly>${escapeHtml(report)}</textarea>
    <div class="actions">
      <button type="button" class="primary" id="copy">Copy results</button>
      <button type="button" class="ghost" id="print">Print</button>
      <button type="button" class="ghost" data-go="check">Review the checks</button>
      <button type="button" class="ghost" id="reset">Start again</button>
    </div>
    <p class="saved-note">If Copy results does not work, click inside the box, select everything, and copy it yourself.</p>
  `;
}

function render() {
  if (state.screen === 'welcome') renderWelcome();
  else if (state.screen === 'done') renderDone();
  else renderCheck();
  renderChrome();
}

function go(target) {
  if (target === 'welcome') state.screen = 'welcome';
  else if (target === 'done') state.screen = 'done';
  else if (target === 'check') state.screen = 'check';
  else if (target === 'next') state.index += 1;
  else if (target === 'prev') state.index -= 1;
  saveState();
  render();
  window.scrollTo(0, 0);
}

function resultsText() {
  const meta = state.meta;
  const counts = totals();
  const problems = allCases().filter((item) => caseState(item.id).status === 'fail');
  const skipped = allCases().filter((item) => caseState(item.id).status === 'blocked');
  const lineFor = (item) => {
    const current = caseState(item.id);
    return `- ${STATUS_LABEL[current.status]} — ${item.title}${current.notes.trim() ? ` — ${current.notes.trim()}` : ''}`;
  };
  const lines = [
    'Learner CSAT (CEA-192) check',
    '',
    `Tester: ${meta.tester || '-'}`,
    `Where: ${meta.environment || '-'}`,
    `Date: ${meta.date || '-'}`,
    `Sign-ins used: ${meta.accounts || '-'}`,
    '',
    `${counts.done} of ${counts.total} checked`,
    `${counts.pass} worked`,
    `${counts.fail} need a look`,
    `${counts.blocked} couldn’t try`,
    `${counts.total - counts.done} not checked`,
    ''
  ];

  lines.push('Needs a look');
  if (problems.length === 0) lines.push('- None');
  problems.forEach((item) => lines.push(lineFor(item)));
  lines.push('');

  lines.push('Couldn’t try');
  if (skipped.length === 0) lines.push('- None');
  skipped.forEach((item) => lines.push(lineFor(item)));
  lines.push('');

  lines.push('Every check');
  GROUPS.forEach((group) => {
    lines.push('');
    lines.push(group.title);
    group.cases.forEach((item) => lines.push(lineFor(item)));
  });

  return lines.join('\n');
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

document.body.addEventListener('click', async (event) => {
  const statusButton = event.target.closest('button[data-status]');
  if (statusButton) {
    const current = caseState(caseAt(state.index).id);
    current.status = current.status === statusButton.dataset.status ? '' : statusButton.dataset.status;
    saveState();
    render();
    return;
  }
  const goButton = event.target.closest('[data-go]');
  if (goButton) {
    go(goButton.dataset.go);
    return;
  }
  const navButton = event.target.closest('[data-goto]');
  if (navButton) {
    state.screen = 'check';
    state.index = Number(navButton.dataset.goto);
    saveState();
    render();
    return;
  }
  if (event.target.id === 'copy') {
    const text = resultsText();
    try {
      await navigator.clipboard.writeText(text);
      showToast('Copied. Open Jira, an email, or a message, then paste.');
    } catch {
      window.prompt('Copy your answers:', text);
    }
  }
  if (event.target.id === 'print') window.print();
  if (event.target.id === 'reset') {
    if (!window.confirm('Clear your answers in this browser and start again?')) return;
    localStorage.removeItem(STORAGE_KEY);
    window.location.reload();
  }
});

document.body.addEventListener('input', (event) => {
  const meta = event.target.dataset.meta;
  if (meta) {
    state.meta[meta] = event.target.value;
    saveState();
    return;
  }
  if (event.target.id === 'notes') {
    caseState(caseAt(state.index).id).notes = event.target.value;
    saveState();
  }
});

document.body.addEventListener('change', (event) => {
  if (event.target.id !== 'jump') return;
  const value = event.target.value;
  if (value === 'welcome' || value === 'done') state.screen = value;
  else {
    state.screen = 'check';
    state.index = Number(value);
  }
  saveState();
  render();
});

render();
</script>
